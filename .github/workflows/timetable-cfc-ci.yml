name: Validate timetable-cfc prototype

on:
  push:
    branches:
      - feat/timetable-cfc-schedule

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Static analysis
        working-directory: app
        run: flutter analyze
      - name: Timetable and security tests
        working-directory: app
        run: >-
          flutter test
          test/timetable_parser_test.dart
          test/timetable_school_test.dart
          test/account_storage_test.dart
          test/http_session_test.dart
          test/nonce_test.dart
      - name: Build Android ARM64 APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zhixing-flash-timetable-cfc-arm64
          path: app/build/app/outputs/flutter-apk/app-release.apk
